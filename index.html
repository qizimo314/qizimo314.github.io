<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>齐子墨的个人网页</title>
    <style>
        body {
            font-family: "微软雅黑", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        td, th {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .hobby {
            margin-top: 20px;
            text-align: center;
        }
        .hobby img {
            width: 150px;
            height: 150px;
            margin: 0 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>齐子墨的个人主页</h1>
        <table>
            <tr>
                <th>姓名</th>
                <td>齐子墨</td>
            </tr>
            <tr>
                <th>年龄</th>
                <td>18岁</td>
            </tr>
            <tr>
                <th>学校</th>
                <td>北京大学</td>
            </tr>
            <tr>
                <th>专业</th>
                <td>化学</td>
            </tr>
        </table>
        <h2>我的爱好</h2>
        <div class="hobby">
            < img src="sing.jpg" alt="唱歌">
            < img src="read.jpg" alt="看书">
        </div>
        <p>我热爱唱歌，在音乐中能找到情绪的抒发与共鸣；也痴迷看书，从文字里探索不同的世界与思想。</p >
    </div>
</body>
</html>
